# descriptive: find it and understand it
id: elephant-castle
title: Elephant carrying a castle
description: An orange elephant walks to the right carrying a cream stone castle with a red crenellated parapet and a blue domed turret; a hooded man in blue leans out of the castle at the left and a second small figure peers over the battlements at the right. The scene sits on its original opaque panel, red with white vine scroll above and blue with white tendrils below, with a brown ornamental terminal at the upper left; only the area outside the panel is transparent.
