id: rabbit-church-bells
title: Rabbit ringing church bells
description: A brown rabbit stands on its hind legs at the left, facing right, and pulls two red twisted bell ropes that hang from the arched doorway of a cream stone church. The church has a blue chevron-tiled roof, a square belfry with two bells, a dark quatrefoil rose window and a tower with a gold cross at the right; the background is transparent.
